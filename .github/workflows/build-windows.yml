name: Khadimi Windows Build

run-name: "Khadimi Windows Build #${{ github.run_number }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source branch or tag"
        required: true
        default: "main"
        type: string
      project_path:
        description: "Optional path to the main .csproj, relative to the private source root"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: khadimi-windows-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Verify private-source key is configured
        shell: pwsh
        env:
          SOURCE_READ_KEY: ${{ secrets.KHADIMI_SOURCE_READ_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_READ_KEY)) {
            throw "Missing repository secret KHADIMI_SOURCE_READ_KEY. Add a read-only deploy key from loudply0-eng/khadimi-almoti."
          }

      - name: Checkout private application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/khadimi-almoti
          ref: ${{ inputs.source_ref || 'main' }}
          path: source
          ssh-key: ${{ secrets.KHADIMI_SOURCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up SDK pinned by global.json
        if: ${{ hashFiles('source/global.json') != '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: source/global.json

      - name: Set up supported .NET SDKs when global.json is absent
        if: ${{ hashFiles('source/global.json') == '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Inspect source and select the application project
        id: project
        shell: pwsh
        env:
          REQUESTED_PROJECT: ${{ inputs.project_path }}
        run: |
          $sourceRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "source"))
          $requested = ($env:REQUESTED_PROJECT ?? "").Trim()
          if (-not $requested) { $requested = "KhadimiNext.csproj" }

          if (-not (Test-Path -LiteralPath $sourceRoot -PathType Container)) {
            throw "Private source checkout directory is missing."
          }

          if ($requested) {
            $candidate = [System.IO.Path]::GetFullPath((Join-Path $sourceRoot $requested))
            $prefix = $sourceRoot.TrimEnd('\') + '\'
            if (-not $candidate.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "project_path must remain inside the private source repository."
            }
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf) -or
                [System.IO.Path]::GetExtension($candidate) -ne ".csproj") {
              throw "The supplied project_path does not identify an existing .csproj file."
            }
            $project = $candidate
          }
          else {
            $projects = @(Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter "*.csproj" |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })

            if ($projects.Count -eq 0) {
              throw "No C# project (.csproj) was found in the private repository. Upload the real application source to the PRIVATE repository first."
            }
            if ($projects.Count -gt 1) {
              $found = ($projects | ForEach-Object { $_.FullName.Substring($sourceRoot.Length).TrimStart('\','/') }) -join '; '
              throw "More than one .csproj was found. Re-run this workflow and set project_path to the main application project. Found: $found"
            }
            $project = $projects[0].FullName
          }

          $relative = $project.Substring($sourceRoot.Length).TrimStart('\','/')
          "project_path=$relative" >> $env:GITHUB_OUTPUT
          "Selected private project: $relative"

      - name: Run updater security smoke tests
        shell: pwsh
        working-directory: source
        run: |
          dotnet run --project tests/UpdateSecurity.Smoke/UpdateSecurity.Smoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Updater security smoke tests failed with exit code $LASTEXITCODE."
          }

      - name: Publish Windows x64 application
        shell: pwsh
        working-directory: source
        env:
          PROJECT_PATH: ${{ steps.project.outputs.project_path }}
        run: |
          $project = Join-Path (Join-Path $env:GITHUB_WORKSPACE "source") $env:PROJECT_PATH
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $null = New-Item -ItemType Directory -Path $publishDir -Force

          dotnet --info
          dotnet publish $project --configuration Release --runtime win-x64 --self-contained true --output $publishDir -p:PublishSingleFile=true -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDir -Recurse -File)
          if ($publishedFiles.Count -eq 0) {
            throw "Publish completed without producing files."
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\Khadimi-Windows-win-x64.zip"
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Khadimi-Windows-win-x64.zip" |
            Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "artifacts\SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Khadimi-Windows-${{ github.run_number }}
          path: |
            artifacts/Khadimi-Windows-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

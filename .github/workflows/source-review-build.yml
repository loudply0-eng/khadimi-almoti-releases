name: Khadimi Source Review Build

run-name: "Khadimi source review build #${{ github.run_number }}"

on:
  push:
    branches:
      - ci-test-review-20261123

permissions:
  contents: read

concurrency:
  group: khadimi-source-review-build
  cancel-in-progress: false

jobs:
  build:
    name: Build existing WPF source on GitHub Windows runner
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Verify source-read secret exists
        shell: pwsh
        env:
          SOURCE_READ_KEY: ${{ secrets.KHADIMI_SOURCE_READ_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_READ_KEY)) {
            throw "Missing KHADIMI_SOURCE_READ_KEY."
          }
          "Read-only source key is configured."

      - name: Checkout private Khadimi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/khadimi-almoti
          ref: source-import-review-20261123
          path: source
          ssh-key: ${{ secrets.KHADIMI_SOURCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Validate project structure
        id: project
        shell: pwsh
        run: |
          $sourceRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "source"))
          $projects = @(Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter "*.csproj" |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })

          if ($projects.Count -ne 1) {
            throw "Expected exactly one C# project, found $($projects.Count)."
          }

          [xml]$xml = Get-Content -LiteralPath $projects[0].FullName -Raw
          $framework = $xml.Project.PropertyGroup.TargetFramework | Where-Object { $_ } | Select-Object -First 1
          $wpf = $xml.Project.PropertyGroup.UseWPF | Where-Object { $_ } | Select-Object -First 1

          if ($framework -ne "net10.0-windows" -or $wpf -ne "true") {
            throw "Unexpected project target: TargetFramework=$framework; UseWPF=$wpf"
          }

          "project_path=$($projects[0].FullName)" >> $env:GITHUB_OUTPUT
          "Validated WPF project: $($projects[0].Name)"

      - name: Restore and build existing application
        shell: pwsh
        env:
          PROJECT_PATH: ${{ steps.project.outputs.project_path }}
        run: |
          dotnet --info
          dotnet restore "$env:PROJECT_PATH" --runtime win-x64
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE."
          }

          dotnet build "$env:PROJECT_PATH" --configuration Release --runtime win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed with exit code $LASTEXITCODE."
          }

      - name: Publish self-contained single-file Windows x64
        shell: pwsh
        env:
          PROJECT_PATH: ${{ steps.project.outputs.project_path }}
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\\publish"
          $null = New-Item -ItemType Directory -Path $publishDir -Force

          dotnet publish "$env:PROJECT_PATH" --configuration Release --runtime win-x64 --self-contained true --no-restore --output $publishDir -p:PublishSingleFile=true -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) {
            throw "Windows publish failed with exit code $LASTEXITCODE."
          }

          $exe = @(Get-ChildItem -LiteralPath $publishDir -File -Filter "*.exe")
          if ($exe.Count -ne 1) {
            throw "Expected one application executable in publish output, found $($exe.Count)."
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\\Khadimi-Windows-review-win-x64.zip"
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Khadimi-Windows-review-win-x64.zip" |
            Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "artifacts\\SHA256SUMS.txt") -Encoding ascii

          "PUBLISHED_EXE=$($exe[0].Name)"
          "ZIP_SIZE=$((Get-Item $zipPath).Length)"
          "SHA256=$hash"

      - name: Upload temporary review artifact (one-day retention)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Khadimi-Source-Review-${{ github.run_number }}
          path: |
            artifacts/Khadimi-Windows-review-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
